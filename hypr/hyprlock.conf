source = ~/.cache/wal/colors-hyprlock.conf

background {
    monitor =
    path = screenshot   
    color = $background
    
    blur_passes = 3
    blur_size = 5
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:80] python ~/.config/hypr/PythonAnimation/bagel.py
    color = $color4
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = $color4
    inner_color = $background
    font_color = $foreground
    fade_on_empty = false
    placeholder_text = Enter Password...
    hide_input = false
    position = 0, -300 
    halign = center
    valign = center
}
